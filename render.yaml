services:
  - type: web
    name: cashflow-intelligence-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cashflow-intelligence-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://your-vercel-app.vercel.app

databases:
  - name: cashflow-intelligence-db
